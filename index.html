<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>WorCry デイリーブレイク</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d2137; }
    select option { background: #1e3a5f; color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;


//
const STORAGE_KEY = "worcry-daily-v3";
const SUPABASE_URL = "https://rxxxxtyogzprxyqnklru.supabase.co";
const SUPABASE_KEY = "sb_publishable_N1i0hlsdzgyBIwFDz54tXA_9cE5y37-";
const OWNER = "根岸";
const TIME_OPTIONS = [15, 30, 60, 90, 120];

//
async function loadFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.main&select=data`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if (rows && rows.length > 0) return rows[0].data;
    return null;
  } catch { return null; }
}

async function saveToSupabase(data) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.main`, {
      method: "PATCH",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ data, updated_at: new Date().toISOString() })
    });
  } catch {}
}

//
function generateId() { return Math.random().toString(36).slice(2, 9); }

function getTodayString() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

function getDisplayDate() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}（${["日","月","火","水","木","金","土"][d.getDay()]}）`;
}

function loadLocal() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : null; } catch { return null; }
}

function saveLocal(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

function makeTask(text, take_id = null) {
  return { id: generateId(), text, take_id, todayFlag: false, done: false, minutes: 30, createdAt: getTodayString() };
}

function makeTake(text, matsu_id) {
  return { id: generateId(), text, matsu_id, done: false, createdAt: getTodayString() };
}

function makeMatsu(text) {
  return { id: generateId(), text, createdAt: getTodayString() };
}

const emptyState = { matsuList: [], takeList: [], tasks: [], completedTasks: [], view: "today" };

//
function App() {
  const [state, setState] = useState(() => loadLocal() || emptyState);
  const [syncing, setSyncing] = useState(false);
  const [inputText, setInputText] = useState("");
  const [bulkText, setBulkText] = useState("");
  const [bulkMode, setBulkMode] = useState(false);
  const [selectedTakeId, setSelectedTakeId] = useState("none");
  const [confirmReset, setConfirmReset] = useState(null);
  const [reportModal, setReportModal] = useState(false);
  const [copied, setCopied] = useState(false);
  const [addingTake, setAddingTake] = useState(null); // matsu_id
  const [newTakeText, setNewTakeText] = useState("");
  const [addingMatsu, setAddingMatsu] = useState(false);
  const [newMatsuText, setNewMatsuText] = useState("");
  const saveTimer = useRef(null);
  const inputRef = useRef(null);

  const { matsuList, takeList, tasks, completedTasks, view } = state;

  // 起動時Supabaseから読み込み
  useEffect(() => {
    setSyncing(true);
    loadFromSupabase().then((data) => {
      if (data) { setState(data); saveLocal(data); }
      setSyncing(false);
    });
  }, []);

  // 変更時保存
  useEffect(() => {
    saveLocal(state);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => saveToSupabase(state), 500);
  }, [state]);

  function set(patch) { setState((s) => ({ ...s, ...patch })); }

  //
  function addMatsu(text) {
    if (!text.trim()) return;
    setState((s) => ({ ...s, matsuList: [...s.matsuList, makeMatsu(text.trim())] }));
    setNewMatsuText(""); setAddingMatsu(false);
  }

  function removeMatsu(id) {
    setState((s) => ({
      ...s,
      matsuList: s.matsuList.filter((m) => m.id !== id),
      takeList: s.takeList.filter((t) => t.matsu_id !== id),
      tasks: s.tasks.map((t) => {
        const take = s.takeList.find((tk) => tk.matsu_id === id && tk.id === t.take_id);
        return take ? { ...t, take_id: null } : t;
      }),
    }));
  }

  //
  function addTake(matsu_id, text) {
    if (!text.trim()) return;
    setState((s) => ({ ...s, takeList: [...s.takeList, makeTake(text.trim(), matsu_id)] }));
    setNewTakeText(""); setAddingTake(null);
  }

  function toggleTakeDone(id) {
    setState((s) => ({ ...s, takeList: s.takeList.map((t) => t.id === id ? { ...t, done: !t.done } : t) }));
  }

  function removeTake(id) {
    setState((s) => ({
      ...s,
      takeList: s.takeList.filter((t) => t.id !== id),
      tasks: s.tasks.map((t) => t.take_id === id ? { ...t, take_id: null } : t),
    }));
  }

  //
  function parseTaskLines(raw) {
    const converted = raw.replace(/:[^\:\n]{1,8}:/g, "\n").replace(/:[^\:\n]{1,8}$/, "");
    return converted.split("\n")
      .map((l) => l.replace(/^[\s\u30FB\-\*\u25A1\u2610\u2713\u2714\u25B6\u25BA\u2022]+/, "").trim())
      .filter((l) => l.length > 0);
  }

  function addTask(text, take_id = null) {
    const t = text.trim();
    if (!t) return;
    setState((s) => {
      if (s.tasks.some((x) => x.text === t)) return s;
      return { ...s, tasks: [...s.tasks, makeTask(t, take_id === "none" ? null : take_id)] };
    });
    setInputText(""); inputRef.current?.focus();
  }

  function addBulkTasks(raw, take_id) {
    const lines = parseTaskLines(raw);
    if (!lines.length) return;
    setState((s) => {
      const existing = new Set(s.tasks.map((t) => t.text));
      const newTasks = lines.filter((l) => !existing.has(l)).map((l) => makeTask(l, take_id === "none" ? null : take_id));
      return { ...s, tasks: [...s.tasks, ...newTasks] };
    });
    setBulkText(""); setBulkMode(false);
  }

  function updateTask(id, patch) {
    setState((s) => ({ ...s, tasks: s.tasks.map((t) => t.id === id ? { ...t, ...patch } : t) }));
  }

  function removeTask(id) {
    setState((s) => ({ ...s, tasks: s.tasks.filter((t) => t.id !== id) }));
  }

  function toggleDone(id) {
    setState((s) => ({ ...s, tasks: s.tasks.map((t) => t.id === id ? { ...t, done: !t.done } : t) }));
  }

  //
  function resetToday() {
    setState((s) => {
      const done = s.tasks.filter((t) => t.done);
      const remaining = s.tasks.filter((t) => !t.done).map((t) => ({ ...t, todayFlag: false }));
      return { ...s, tasks: remaining, completedTasks: [...(s.completedTasks || []), ...done] };
    });
    setConfirmReset(null);
  }

  function generateReport() {
    const doneCurrent = tasks.filter((t) => t.done);
    const allDone = [...(completedTasks || []), ...doneCurrent];
    const remaining = tasks.filter((t) => !t.done);
    const lines = ["✅ 完了タスク"];
    if (!allDone.length) lines.push("（なし）");
    allDone.forEach((t) => { const tk = takeList.find((tk) => tk.id === t.take_id); lines.push(`${tk ? `[${tk.text}] ` : ""}${t.text}:${OWNER}:`); });
    lines.push("", "📋 持ち越しタスク");
    if (!remaining.length) lines.push("（なし）");
    remaining.forEach((t) => { const tk = takeList.find((tk) => tk.id === t.take_id); lines.push(`${tk ? `[${tk.text}] ` : ""}${t.text}:${OWNER}:`); });
    return lines.join("\n");
  }

  function executeWeekReset() {
    setState((s) => ({ ...emptyState, matsuList: s.matsuList, takeList: s.takeList }));
    setReportModal(false); setCopied(false);
  }

  function copyReport() {
    navigator.clipboard.writeText(generateReport()).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  }

  //
  const todayTasks = tasks.filter((t) => t.todayFlag);
  const weekTasks = tasks.filter((t) => !t.todayFlag);
  const totalMin = tasks.filter((t) => t.todayFlag && !t.done).reduce((s, t) => s + (t.minutes || 0), 0);
  const doneCount = todayTasks.filter((t) => t.done).length;
  const progressPct = todayTasks.length > 0 ? Math.round((doneCount / todayTasks.length) * 100) : 0;

  const sortedToday = [...todayTasks].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return 0;
  });

  //
  const btnStyle = (active, color = "#46A7E1") => ({
    padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer",
    fontSize: 12, fontWeight: 600,
    background: active ? `linear-gradient(135deg,#46A7E1,#2d6a9f)` : "rgba(255,255,255,0.08)",
    color: active ? "#fff" : "#94a3b8", transition: "all 0.2s",
  });

  const card = { background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 14, padding: "16px", marginBottom: 10 };

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#0d2137 0%,#1e3a5f 50%,#1a3255 100%)", fontFamily: "'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif", color: "#e2e8f0" }}>

      {/* Header */}
      <div style={{ background: "rgba(30,58,95,0.9)", borderBottom: "1px solid rgba(255,255,255,0.08)", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100, backdropFilter: "blur(20px)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, background: "linear-gradient(135deg,#46A7E1,#2d6a9f)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: "bold", fontSize: 16 }}>W</div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>WorCry デイリーブレイク</div>
            <div style={{ fontSize: 10, color: syncing ? "#46A7E1" : "#94a3b8" }}>{syncing ? "同期中..." : getDisplayDate()}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {[["today","今日"],["week","今週"],["matsu","松竹"],["add","追加"]].map(([v,label]) => (
            <button key={v} onClick={() => set({ view: v })} style={btnStyle(view === v)}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 760, margin: "0 auto", padding: "20px 14px" }}>

        {/* ══ 今日タブ ══ */}
        {view === "today" && (
          <div>
            {/* 進捗 */}
            <div style={{ ...card, marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                <div>
                  <span style={{ fontSize: 26, fontWeight: 800, color: "#46A7E1" }}>{doneCount}</span>
                  <span style={{ fontSize: 14, color: "#64748b" }}> / {todayTasks.length} 完了</span>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 18, fontWeight: 700, color: totalMin > 480 ? "#FF4757" : "#4ade80" }}>
                    {Math.floor(totalMin/60)}h{totalMin%60>0?`${totalMin%60}m`:""}
                  </div>
                  <div style={{ fontSize: 10, color: "#64748b" }}>残り見積もり</div>
                </div>
              </div>
              <div style={{ height: 6, borderRadius: 99, background: "rgba(255,255,255,0.08)", overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${progressPct}%`, background: "linear-gradient(90deg,#46A7E1,#2d6a9f)", borderRadius: 99, transition: "width 0.4s" }} />
              </div>
              {totalMin > 480 && <div style={{ marginTop: 6, fontSize: 11, color: "#FF4757" }}>⚠️ 8時間超。削減または委任を検討してください</div>}
            </div>

            {/* 今日タスク */}
            {sortedToday.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 0", color: "#4a5568" }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>🌅</div>
                <div style={{ fontSize: 13 }}>「今週」タブから今日やるタスクを選んでください</div>
              </div>
            )}
            {sortedToday.map((task) => {
              const take = takeList.find((tk) => tk.id === task.take_id);
              return (
                <TodayRow key={task.id} task={task} take={take}
                  onToggle={() => toggleDone(task.id)}
                  onMoveToWeek={() => updateTask(task.id, { todayFlag: false })}
                />
              );
            })}

            {/* 今日リセット */}
            {todayTasks.length > 0 && (
              <div style={{ marginTop: 20, textAlign: "center" }}>
                {confirmReset === "today" ? (
                  <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                    <span style={{ fontSize: 12, color: "#94a3b8", alignSelf: "center" }}>完了タスクを削除してリセットしますか？</span>
                    <button onClick={resetToday} style={{ background: "#FF475730", border: "1px solid #FF4757", borderRadius: 8, padding: "5px 14px", color: "#FF4757", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>リセット</button>
                    <button onClick={() => setConfirmReset(null)} style={{ background: "rgba(255,255,255,0.06)", border: "none", borderRadius: 8, padding: "5px 14px", color: "#64748b", fontSize: 12, cursor: "pointer" }}>キャンセル</button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmReset("today")} style={{ background: "none", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 20, padding: "6px 16px", color: "#64748b", fontSize: 12, cursor: "pointer" }}>今日をリセット</button>
                )}
              </div>
            )}

            {/* 今日やらないタスク */}
            {weekTasks.length > 0 && (
              <div style={{ ...card, borderStyle: "dashed", marginTop: 16 }}>
                <div style={{ fontSize: 12, color: "#94a3b8", fontWeight: 600, marginBottom: 10 }}>今日やらないタスク</div>
                {weekTasks.map((t) => {
                  const take = takeList.find((tk) => tk.id === t.take_id);
                  return (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                      <div style={{ flex: 1 }}>
                        {take && <span style={{ fontSize: 10, color: "#46A7E1", marginRight: 6 }}>[{take.text}]</span>}
                        <span style={{ fontSize: 13, color: "#94a3b8" }}>{t.text}</span>
                      </div>
                      <button onClick={() => updateTask(t.id, { todayFlag: true })} style={{ background: "rgba(102,126,234,0.2)", border: "1px solid #46A7E150", borderRadius: 6, padding: "3px 10px", color: "#46A7E1", fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>今日やる</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ══ 今週タブ ══ */}
        {view === "week" && (
          <div>
            {/* 竹ごとにグルーピング */}
            {takeList.length === 0 && tasks.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 0", color: "#4a5568" }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>🎋</div>
                <div style={{ fontSize: 13 }}>「松竹」タブで松と竹を設定してください</div>
              </div>
            )}

            {takeList.map((take) => {
              const takeTasks = tasks.filter((t) => t.take_id === take.id);
              const doneCount = takeTasks.filter((t) => t.done).length;
              const matsu = matsuList.find((m) => m.id === take.matsu_id);
              return (
                <TakeSection key={take.id} take={take} matsu={matsu} tasks={takeTasks} doneCount={doneCount}
                  onToggleTakeDone={() => toggleTakeDone(take.id)}
                  onToggleTask={(id) => toggleDone(id)}
                  onSetToday={(id) => updateTask(id, { todayFlag: true })}
                  onRemoveTask={(id) => removeTask(id)}
                  onAddTask={(text) => {
                    if (!text.trim()) return;
                    setState((s) => {
                      if (s.tasks.some((x) => x.text === text.trim())) return s;
                      return { ...s, tasks: [...s.tasks, makeTask(text.trim(), take.id)] };
                    });
                  }}
                />
              );
            })}

            {/* 竹なしタスク */}
            {(() => {
              const freeTasks = tasks.filter((t) => !t.take_id);
              if (freeTasks.length === 0) return null;
              return (
                <div style={{ ...card, marginTop: 8 }}>
                  <div style={{ fontSize: 12, color: "#94a3b8", fontWeight: 700, marginBottom: 10 }}>その他タスク</div>
                  {freeTasks.map((t) => (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                      <input type="checkbox" checked={t.done} onChange={() => toggleDone(t.id)} style={{ accentColor: "#A0AEC0", cursor: "pointer" }} />
                      <span style={{ flex: 1, fontSize: 13, color: t.done ? "#4a5568" : "#e2e8f0", textDecoration: t.done ? "line-through" : "none" }}>{t.text}</span>
                      {!t.todayFlag && <button onClick={() => updateTask(t.id, { todayFlag: true })} style={{ background: "rgba(102,126,234,0.2)", border: "1px solid #46A7E150", borderRadius: 6, padding: "3px 8px", color: "#46A7E1", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>今日</button>}
                      <button onClick={() => removeTask(t.id)} style={{ background: "none", border: "none", color: "#4a5568", cursor: "pointer", fontSize: 14 }}>×</button>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* 週次レポートリセット */}
            <div style={{ marginTop: 24, borderTop: "1px solid rgba(255,255,255,0.08)", paddingTop: 20, textAlign: "center" }}>
              {confirmReset === "week" ? (
                <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, color: "#94a3b8", alignSelf: "center" }}>レポートを生成してリセットしますか？</span>
                  <button onClick={() => { setReportModal(true); setConfirmReset(null); }} style={{ background: "#FF475730", border: "1px solid #FF4757", borderRadius: 8, padding: "5px 14px", color: "#FF4757", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>生成＆リセット</button>
                  <button onClick={() => setConfirmReset(null)} style={{ background: "rgba(255,255,255,0.06)", border: "none", borderRadius: 8, padding: "5px 14px", color: "#64748b", fontSize: 12, cursor: "pointer" }}>キャンセル</button>
                </div>
              ) : (
                <button onClick={() => setConfirmReset("week")} style={{ background: "#FF475715", border: "1px solid #FF475750", borderRadius: 20, padding: "8px 20px", color: "#FF4757", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  週次レポート生成＆リセット
                </button>
              )}
            </div>
          </div>
        )}

        {/* ══ 松竹タブ ══ */}
        {view === "matsu" && (
          <div>
            <div style={{ fontSize: 12, color: "#64748b", marginBottom: 16 }}>月初MTGで松（月次目標）→ 竹（週次目標）を設定します</div>

            {matsuList.map((matsu) => {
              const takes = takeList.filter((t) => t.matsu_id === matsu.id);
              return (
                <div key={matsu.id} style={{ ...card, borderLeft: "3px solid #F28708" }}>
                  {/* 松ヘッダー */}
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                    <span style={{ fontSize: 11, background: "rgba(255,159,67,0.2)", color: "#F28708", padding: "2px 8px", borderRadius: 99, fontWeight: 700 }}>松</span>
                    <span style={{ flex: 1, fontSize: 14, fontWeight: 700 }}>{matsu.text}</span>
                    <button onClick={() => removeMatsu(matsu.id)} style={{ background: "none", border: "none", color: "#4a5568", cursor: "pointer", fontSize: 16 }}>×</button>
                  </div>

                  {/* 竹リスト */}
                  {takes.map((take) => (
                    <div key={take.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0 6px 16px", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                      <span style={{ fontSize: 11, background: "rgba(102,126,234,0.2)", color: "#46A7E1", padding: "2px 8px", borderRadius: 99, fontWeight: 700 }}>竹</span>
                      <span style={{ flex: 1, fontSize: 13, color: take.done ? "#4a5568" : "#e2e8f0", textDecoration: take.done ? "line-through" : "none" }}>{take.text}</span>
                      <span style={{ fontSize: 11, color: "#64748b" }}>{tasks.filter((t) => t.take_id === take.id && t.done).length}/{tasks.filter((t) => t.take_id === take.id).length}梅</span>
                      <button onClick={() => removeTake(take.id)} style={{ background: "none", border: "none", color: "#4a5568", cursor: "pointer", fontSize: 14 }}>×</button>
                    </div>
                  ))}

                  {/* 竹追加 */}
                  {addingTake === matsu.id ? (
                    <div style={{ display: "flex", gap: 6, marginTop: 10, paddingLeft: 16 }}>
                      <input autoFocus value={newTakeText} onChange={(e) => setNewTakeText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") addTake(matsu.id, newTakeText); if (e.key === "Escape") setAddingTake(null); }}
                        placeholder="竹（週次目標）を入力してEnter"
                        style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "1px solid #46A7E150", borderRadius: 8, padding: "6px 10px", color: "#e2e8f0", fontSize: 13, outline: "none" }}
                      />
                      <button onClick={() => addTake(matsu.id, newTakeText)} style={{ background: "rgba(102,126,234,0.3)", border: "none", borderRadius: 8, padding: "6px 12px", color: "#46A7E1", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>追加</button>
                      <button onClick={() => setAddingTake(null)} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 12 }}>×</button>
                    </div>
                  ) : (
                    <button onClick={() => { setAddingTake(matsu.id); setNewTakeText(""); }} style={{ marginTop: 10, marginLeft: 16, background: "rgba(102,126,234,0.1)", border: "1px dashed #46A7E150", borderRadius: 8, padding: "5px 14px", color: "#46A7E1", fontSize: 12, cursor: "pointer" }}>
                      + 竹を追加
                    </button>
                  )}
                </div>
              );
            })}

            {/* 松追加 */}
            {addingMatsu ? (
              <div style={{ ...card, borderLeft: "3px solid #F28708" }}>
                <input autoFocus value={newMatsuText} onChange={(e) => setNewMatsuText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") addMatsu(newMatsuText); if (e.key === "Escape") setAddingMatsu(false); }}
                  placeholder="松（月次目標）を入力してEnter"
                  style={{ width: "100%", background: "rgba(255,255,255,0.08)", border: "1px solid #F2870850", borderRadius: 8, padding: "8px 12px", color: "#e2e8f0", fontSize: 14, outline: "none" }}
                />
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <button onClick={() => addMatsu(newMatsuText)} style={{ background: "rgba(255,159,67,0.3)", border: "none", borderRadius: 8, padding: "6px 16px", color: "#F28708", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>追加</button>
                  <button onClick={() => setAddingMatsu(false)} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 13 }}>キャンセル</button>
                </div>
              </div>
            ) : (
              <button onClick={() => setAddingMatsu(true)} style={{ width: "100%", background: "rgba(255,159,67,0.1)", border: "1px dashed #F2870850", borderRadius: 12, padding: "12px", color: "#F28708", fontSize: 13, fontWeight: 700, cursor: "pointer", marginTop: 8 }}>
                + 松（月次目標）を追加
              </button>
            )}
          </div>
        )}

        {/* ══ 追加タブ ══ */}
        {view === "add" && (
          <div>
            <div style={card}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ fontSize: 12, color: "#94a3b8", fontWeight: 600 }}>🎋 梅タスクを追加</div>
                <button onClick={() => { setBulkMode((b) => !b); setBulkText(""); setInputText(""); }}
                  style={{ background: bulkMode ? "rgba(102,126,234,0.25)" : "rgba(255,255,255,0.08)", border: `1px solid ${bulkMode ? "#46A7E1" : "rgba(255,255,255,0.12)"}`, borderRadius: 20, padding: "4px 12px", color: bulkMode ? "#46A7E1" : "#94a3b8", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                  {bulkMode ? "1件ずつ" : "まとめて貼り付け"}
                </button>
              </div>

              {/* 竹選択 */}
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 10, color: "#64748b", fontWeight: 700, marginBottom: 4, letterSpacing: "0.1em" }}>紐付ける竹</div>
                <select value={selectedTakeId} onChange={(e) => setSelectedTakeId(e.target.value)}
                  style={{ width: "100%", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "8px 12px", color: "#e2e8f0", fontSize: 13, outline: "none", cursor: "pointer" }}>
                  <option value="none" style={{ background: "#1e3a5f" }}>その他（竹なし）</option>
                  {matsuList.map((m) => {
                    const takes = takeList.filter((t) => t.matsu_id === m.id);
                    return takes.map((t) => (
                      <option key={t.id} value={t.id} style={{ background: "#1e3a5f" }}>[{m.text}] {t.text}</option>
                    ));
                  })}
                </select>
              </div>

              {!bulkMode ? (
                <div style={{ display: "flex", gap: 8 }}>
                  <input ref={inputRef} value={inputText} onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") addTask(inputText, selectedTakeId); }}
                    placeholder="タスク名を入力してEnter"
                    style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, padding: "10px 14px", color: "#e2e8f0", fontSize: 14, outline: "none" }}
                  />
                  <button onClick={() => addTask(inputText, selectedTakeId)} style={{ background: "linear-gradient(135deg,#46A7E1,#2d6a9f)", border: "none", borderRadius: 10, padding: "10px 18px", color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 14 }}>追加</button>
                </div>
              ) : (
                <div>
                  <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)}
                    placeholder={"Slackキャンバスからコピーしてそのまま貼り付け\n:根岸: タグが区切りとして自動認識されます"}
                    rows={7}
                    style={{ width: "100%", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, padding: "12px 14px", color: "#e2e8f0", fontSize: 13, outline: "none", resize: "vertical", boxSizing: "border-box", fontFamily: "inherit", lineHeight: 1.7 }}
                  />
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
                    <div style={{ fontSize: 12, color: "#64748b" }}>{parseTaskLines(bulkText).length} 件を追加予定</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => { setBulkText(""); setBulkMode(false); }} style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, padding: "8px 16px", color: "#94a3b8", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>キャンセル</button>
                      <button onClick={() => addBulkTasks(bulkText, selectedTakeId)} disabled={!bulkText.trim()} style={{ background: bulkText.trim() ? "linear-gradient(135deg,#46A7E1,#2d6a9f)" : "rgba(255,255,255,0.08)", border: "none", borderRadius: 10, padding: "8px 20px", color: bulkText.trim() ? "#fff" : "#4a5568", fontWeight: 700, cursor: bulkText.trim() ? "pointer" : "default", fontSize: 13 }}>一括追加</button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* 追加済みタスク一覧 */}
            {tasks.length > 0 && (
              <div style={{ marginTop: 8 }}>
                <div style={{ fontSize: 11, color: "#64748b", marginBottom: 8, paddingLeft: 2 }}>追加済み · {tasks.length}件</div>
                {tasks.map((t) => {
                  const take = takeList.find((tk) => tk.id === t.take_id);
                  return (
                    <div key={t.id} style={{ ...card, padding: "10px 14px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        {take && <span style={{ fontSize: 10, background: "rgba(102,126,234,0.2)", color: "#46A7E1", padding: "2px 7px", borderRadius: 99, fontWeight: 700, whiteSpace: "nowrap" }}>{take.text}</span>}
                        <span style={{ flex: 1, fontSize: 13 }}>{t.text}</span>
                        {t.todayFlag && <span style={{ fontSize: 10, background: "rgba(102,126,234,0.2)", color: "#46A7E1", padding: "2px 7px", borderRadius: 99, fontWeight: 700 }}>今日</span>}
                        <button onClick={() => removeTask(t.id)} style={{ background: "none", border: "none", color: "#4a5568", cursor: "pointer", fontSize: 16 }}>×</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      {/* 週次レポートモーダル */}
      {reportModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 20 }}>
          <div style={{ background: "#1e3a5f", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 18, padding: 24, width: "100%", maxWidth: 520 }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>週次レポート</div>
            <div style={{ fontSize: 12, color: "#64748b", marginBottom: 16 }}>Slackキャンバスにそのままコピペできます</div>
            <pre style={{ background: "rgba(0,0,0,0.3)", borderRadius: 10, padding: 16, fontSize: 13, lineHeight: 1.8, color: "#e2e8f0", whiteSpace: "pre-wrap", wordBreak: "break-all", maxHeight: 320, overflowY: "auto", fontFamily: "inherit" }}>
              {generateReport()}
            </pre>
            <div style={{ display: "flex", gap: 8, marginTop: 16, justifyContent: "flex-end", flexWrap: "wrap" }}>
              <button onClick={() => setReportModal(false)} style={{ background: "rgba(255,255,255,0.06)", border: "none", borderRadius: 10, padding: "8px 16px", color: "#94a3b8", fontSize: 13, cursor: "pointer" }}>閉じる</button>
              <button onClick={copyReport} style={{ background: copied ? "rgba(74,222,128,0.2)" : "rgba(102,126,234,0.3)", border: `1px solid ${copied ? "#4ade80" : "#46A7E1"}`, borderRadius: 10, padding: "8px 18px", color: copied ? "#4ade80" : "#46A7E1", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                {copied ? "✓ コピーしました" : "コピー"}
              </button>
              <button onClick={executeWeekReset} style={{ background: "#FF475730", border: "1px solid #FF4757", borderRadius: 10, padding: "8px 18px", color: "#FF4757", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>リセット実行</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

//
function TodayRow({ task, take, onToggle, onMoveToWeek }) {
  return (
    <div onClick={onToggle} style={{
      background: task.done ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.05)",
      border: `1px solid ${task.done ? "rgba(255,255,255,0.04)" : "rgba(102,126,234,0.3)"}`,
      borderLeft: `3px solid ${task.done ? "rgba(255,255,255,0.08)" : "#46A7E1"}`,
      borderRadius: 12, padding: "12px 14px", marginBottom: 8,
      opacity: task.done ? 0.5 : 1, cursor: "pointer", transition: "all 0.2s",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <input type="checkbox" checked={task.done} onChange={onToggle} onClick={(e) => e.stopPropagation()} style={{ accentColor: "#46A7E1", cursor: "pointer", width: 16, height: 16 }} />
        <div style={{ flex: 1 }}>
          {take && <div style={{ fontSize: 10, color: "#46A7E1", marginBottom: 2 }}>{take.text}</div>}
          <div style={{ fontSize: 14, fontWeight: 600, color: task.done ? "#4a5568" : "#e2e8f0", textDecoration: task.done ? "line-through" : "none" }}>{task.text}</div>
        </div>
        <div style={{ fontSize: 11, color: "#64748b", background: "rgba(255,255,255,0.06)", padding: "3px 8px", borderRadius: 99 }}>
          {task.minutes >= 60 ? `${Math.floor(task.minutes/60)}h${task.minutes%60>0?`${task.minutes%60}m`:""}` : `${task.minutes}m`}
        </div>
        <button onClick={(e) => { e.stopPropagation(); onMoveToWeek(); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#4a5568", fontSize: 14, padding: "0 2px" }}>↩</button>
      </div>
    </div>
  );
}

//
function TakeSection({ take, matsu, tasks, doneCount, onToggleTakeDone, onToggleTask, onSetToday, onRemoveTask, onAddTask }) {
  const [expanded, setExpanded] = useState(true);
  const [newTaskText, setNewTaskText] = useState("");
  const [adding, setAdding] = useState(false);

  return (
    <div style={{
      background: "rgba(255,255,255,0.06)",
      border: `1px solid ${take.done ? "rgba(255,255,255,0.06)" : "rgba(102,126,234,0.25)"}`,
      borderLeft: `3px solid ${take.done ? "rgba(255,255,255,0.1)" : "#46A7E1"}`,
      borderRadius: 14, padding: "14px", marginBottom: 10,
      opacity: take.done ? 0.6 : 1,
    }}>
      {/* 竹ヘッダー */}
      <div onClick={() => setExpanded((e) => !e)} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: expanded ? 10 : 0 }}>
        <span style={{ fontSize: 11, background: "rgba(102,126,234,0.2)", color: "#46A7E1", padding: "2px 8px", borderRadius: 99, fontWeight: 700 }}>竹</span>
        {matsu && <span style={{ fontSize: 10, color: "#F28708" }}>{matsu.text}</span>}
        <span style={{ flex: 1, fontSize: 14, fontWeight: 700 }}>{take.text}</span>
        <span style={{ fontSize: 11, color: doneCount === tasks.length && tasks.length > 0 ? "#4ade80" : "#64748b" }}>
          {doneCount}/{tasks.length}
        </span>
        <button onClick={(e) => { e.stopPropagation(); onToggleTakeDone(); }} style={{ background: take.done ? "rgba(74,222,128,0.2)" : "rgba(255,255,255,0.06)", border: `1px solid ${take.done ? "#4ade80" : "rgba(255,255,255,0.12)"}`, borderRadius: 6, padding: "2px 10px", color: take.done ? "#4ade80" : "#64748b", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
          {take.done ? "完了" : "完了にする"}
        </button>
        <span style={{ color: "#64748b", fontSize: 14 }}>{expanded ? "▾" : "▸"}</span>
      </div>

      {expanded && (
        <>
          {tasks.map((t) => (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
              <input type="checkbox" checked={t.done} onChange={() => onToggleTask(t.id)} style={{ accentColor: "#46A7E1", cursor: "pointer" }} />
              <span style={{ flex: 1, fontSize: 13, color: t.done ? "#4a5568" : "#e2e8f0", textDecoration: t.done ? "line-through" : "none" }}>{t.text}</span>
              {t.todayFlag && <span style={{ fontSize: 10, background: "rgba(102,126,234,0.15)", color: "#46A7E1", padding: "2px 6px", borderRadius: 99, fontWeight: 700 }}>今日</span>}
              {!t.todayFlag && !t.done && <button onClick={() => onSetToday(t.id)} style={{ background: "rgba(102,126,234,0.2)", border: "1px solid #46A7E150", borderRadius: 6, padding: "2px 8px", color: "#46A7E1", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>今日</button>}
              <button onClick={() => onRemoveTask(t.id)} style={{ background: "none", border: "none", color: "#4a5568", cursor: "pointer", fontSize: 14 }}>×</button>
            </div>
          ))}

          {adding ? (
            <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
              <input autoFocus value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { onAddTask(newTaskText); setNewTaskText(""); setAdding(false); } if (e.key === "Escape") setAdding(false); }}
                placeholder="梅タスクを追加（Enter）"
                style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "1px solid #46A7E150", borderRadius: 7, padding: "5px 10px", color: "#e2e8f0", fontSize: 12, outline: "none" }}
              />
              <button onClick={() => { onAddTask(newTaskText); setNewTaskText(""); setAdding(false); }} style={{ background: "rgba(102,126,234,0.3)", border: "none", borderRadius: 7, padding: "5px 10px", color: "#46A7E1", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>+</button>
              <button onClick={() => setAdding(false)} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 12 }}>×</button>
            </div>
          ) : (
            <button onClick={() => setAdding(true)} style={{ marginTop: 8, background: "none", border: "1px dashed rgba(102,126,234,0.3)", borderRadius: 7, padding: "4px 12px", color: "#46A7E1", fontSize: 11, cursor: "pointer" }}>
              + 梅タスクを追加
            </button>
          )}
        </>
      )}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
